# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   pnpm list @n8n/node-cli
#
# To upgrade, add @n8n/node-cli@latest as a dev dependency using your package manager.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# This workflow uses npm staged publishing because direct publishing with
# bypass-2FA tokens is being retired. Configure a granular npm token with
# package read/write access as the NPM_TOKEN repository secret.
#
# After a successful workflow run, approve the staged package with 2FA on
# npmjs.com. Once the first version exists, configure npm Trusted Publishing
# for this repository and workflow, then revoke the long-lived token.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# This workflow triggers on tags matching "*.*.*" (e.g. 0.2.0).
# If you prefer tags with a "v" prefix (e.g. v0.2.0), change the filter to:
#   tags: ['v*.*.*']
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# For later versions, run the following command locally to create and push a
# version tag:
#
#   pnpm run release
#
# This will prompt for a version bump, update the changelog, commit, tag, and
# push. The workflow stages the package; approve it on npmjs.com to publish it.

name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      # See "TAG CONVENTION" above if you prefer tags with a "v" prefix.
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: 'pnpm install --frozen-lockfile'

      - name: Validate package
        run: |
          pnpm run lint
          pnpm test

      - name: Stage package for npm review
        # Direct publishing with bypass-2FA tokens is being retired by npm.
        # Staged publishing keeps the GitHub provenance and requires a maintainer
        # to approve the package with 2FA on npmjs.com before it becomes public.
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm stage publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
